<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif !important}
:root{
  --bg:#F5F0E8;
  --card:#FFFFFF;
  --card2:#FAFAF6;
  --border:#E4DDD2;
  --border2:#EDE7DC;
  --text:#2D2D2D;
  --muted:#7A7168;
  --accent:#5B7FA6;
  --green:#5E9E6E;
  --red:#C06060;
  --amber:#B8893A;
  --hdr-bg:#FFFFFF;
  --sidebar-bg:#FAF8F4;
  --tl-done:#5B7FA6;
  --tl-coast:#5E9E6E;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  font-size:13px;height:100vh;overflow:hidden;
}
#error-box{display:none;position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;
  padding:12px 16px;z-index:9999;font-size:13px;white-space:pre-wrap;border-bottom:2px solid #7f1d1d}
#app{display:flex;flex-direction:column;height:100vh}

/* ── header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  height:52px;background:var(--hdr-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-title{font-weight:700;font-size:15px;letter-spacing:-0.2px;color:var(--text)}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:10px}
.tabs{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px}
.tab-btn{padding:5px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-radius:5px;font-size:12px;font-weight:500;transition:all .15s;letter-spacing:-0.1px}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(91,127,166,.3)}

/* ── layout ── */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:264px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);
  background:var(--sidebar-bg);padding:14px 12px 20px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.main{flex:1;overflow-y:auto;padding:22px 24px}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── sidebar inputs ── */
.sec-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.9px;padding:10px 4px 5px;border-bottom:1px solid var(--border2);margin-bottom:4px}
.inp-row{display:flex;align-items:center;justify-content:space-between;padding:4px 4px;gap:6px}
.inp-row label{color:var(--text);font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.inp-row input[type=number]{
  width:86px;background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:4px 7px;font-size:12px;text-align:right;
  font-family:inherit;transition:border-color .15s}
.inp-row input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,127,166,.12)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.toggle-wrap{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.toggle{width:32px;height:17px;background:var(--border);border-radius:9px;position:relative;transition:background .15s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.toggle.on::after{left:17px}
.divider{height:1px;background:var(--border2);margin:6px 0}
.opt-btn{width:100%;padding:7px;background:var(--accent);color:#fff;border:none;border-radius:7px;
  font-size:12px;font-weight:600;cursor:pointer;margin-top:8px;letter-spacing:.1px;
  transition:background .15s;font-family:inherit}
.opt-btn:hover{background:#4a6e94}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:14px}

/* ── stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;letter-spacing:.2px}
.stat-value{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* ── progress ── */
.prog-wrap{margin-bottom:10px}
.prog-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.prog-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--border2)}
.prog-fill{height:100%;border-radius:4px;transition:width .4s ease}

/* ── timeline ── */
.timeline{position:relative;height:44px;margin:18px 0 6px}
.tl-track{position:absolute;top:50%;left:0;right:0;height:5px;background:var(--bg);
  border:1px solid var(--border2);border-radius:3px;transform:translateY(-50%)}
.tl-fill-done{position:absolute;top:0;left:0;height:100%;background:var(--tl-done);border-radius:3px;opacity:.8}
.tl-fill-coast{position:absolute;top:0;height:100%;background:var(--tl-coast);border-radius:0 3px 3px 0;opacity:.65}
.tl-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);
  border:2px solid var(--card)}
.tl-label{position:absolute;top:calc(50% + 11px);font-size:10px;color:var(--muted);
  transform:translateX(-50%);white-space:nowrap;font-weight:500}

/* ── chart ── */
.chart-wrap{width:100%;overflow-x:auto}
svg.chart{width:100%;max-width:680px;display:block}

/* ── budget table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:var(--card2);color:var(--muted);font-weight:600;padding:7px 9px;
  text-align:right;white-space:nowrap;border-bottom:2px solid var(--border);font-size:11px;letter-spacing:.1px}
th:first-child{text-align:left;padding-left:10px}
td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--border2);color:var(--text)}
td:first-child{text-align:left;font-weight:600;padding-left:10px}
tr:hover td{background:var(--card2)}
tr.phase-divider td{border-top:2px dashed var(--border);background:transparent}
tr.phase-header td{background:var(--card2);font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.7px;padding:3px 9px}
tr.phase-header td:first-child{padding-left:10px}
.pos{color:var(--green);font-weight:500}
.neg{color:var(--red);font-weight:500}
.neu{color:var(--muted)}
.dim{color:var(--muted);font-style:italic;font-size:11px}

/* ── summary ── */
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.sum-item{background:var(--card2);border:1px solid var(--border2);border-radius:9px;padding:12px 14px}
.sum-item.highlight{border-color:var(--green);background:#F6FAF7}
.sum-item-label{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.sum-item-value{font-size:18px;font-weight:700;letter-spacing:-.3px}

/* ── wedding ── */
.wedding-bar{height:9px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;overflow:hidden;margin-top:7px}
.wedding-fill{height:100%;background:var(--amber);border-radius:4px;transition:width .3s}

/* ── note chip ── */
.chip{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;margin-left:4px;vertical-align:middle}
.chip-blue{background:rgba(91,127,166,.12);color:var(--accent)}
.chip-green{background:rgba(94,158,110,.12);color:var(--green)}
.chip-amber{background:rgba(184,137,58,.12);color:var(--amber)}
</style>
</head>
<body>
<div id="error-box"></div>
<div id="app"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var b = document.getElementById('error-box');
  b.style.display = 'block';
  b.textContent = 'JS Error: ' + msg + '\n  at ' + src + ':' + line + ':' + col +
    (err && err.stack ? '\n\n' + err.stack : '');
  return false;
};

// ── state ──────────────────────────────────────────────────────────────────────
var S = {
  currentAge: 29.5, retirementAge: 60,
  brokerageAssets: 200000, iraAssets: 380000,
  targetSpending: 200000, swr: 2, returnRate: 10, inflationRate: 3.25,
  planningYear: 2027, annualSalary: 200000, taxRate: 30,
  monthlyExpenses: 2500, monthlyRent: 3100, rentFreeMonths: 1,
  expectedTaxPayment: 13500, annual401kCap: 23500, rate401k: 0,
  bonusPct: 20, pctBonusSaved: 77, employer401kMatch: 11500,
  firstMonthFraction: 0.25, firstMonthNoExpenses: true, weddingGoal: 15000,
  inheritanceMonthly: 1500, annualDiscretionary: 0,
  tab: 'coastfire'
};

// ── formatting ─────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '$0';
  var abs = Math.abs(Math.round(n));
  return (n < 0 ? '-$' : '$') + abs.toLocaleString();
}
function fmtM(n) {
  var a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + (a / 1e3).toFixed(0) + 'K';
  return fmt(n);
}
function pct(n, d) { return (isNaN(n) ? 0 : n).toFixed(d === undefined ? 1 : d) + '%'; }
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function totalAssets(s) { return (s.brokerageAssets || 0) + (s.iraAssets || 0); }

// ── TWO-PHASE budget computation ───────────────────────────────────────────────
// Phase 1 (months 1–3): run at the user-set rate401k to accrue exactly the tax payment.
// Phase 2 (months 4–12): funnel ALL remaining income into 401K until cap, then personal savings.
// The April tax is paid from the Q1 accrued pool — it does NOT touch April's income.
// inheritanceMonthly is now a user input on s; no global constant needed

function computeBudget(s) {
  var months = [], cum401k = 0, mGross = s.annualSalary / 12;

  for (var i = 1; i <= 12; i++) {
    var gross   = i === 1 ? mGross * s.firstMonthFraction : mGross;
    var postTax = gross * (1 - s.taxRate / 100);
    var rent    = i <= s.rentFreeMonths ? 0 : s.monthlyRent;
    var exp;
    if (i === 1 && s.firstMonthNoExpenses) {
      exp = 0;                                                     // deferred entirely
    } else if (i === 2 && s.firstMonthNoExpenses) {
      exp = s.monthlyExpenses * (1 + s.firstMonthFraction);        // month 2 + fractional month 1
    } else if (i === 1 && !s.firstMonthNoExpenses) {
      exp = s.monthlyExpenses * s.firstMonthFraction;              // scaled to fraction of month
    } else {
      exp = s.monthlyExpenses;
    }

    var capRem = Math.max(0, s.annual401kCap - cum401k);
    var c401k, remInc, pSav, disc = 0;

    if (i <= 3) {
      // ── Phase 1: explicit rate, income reserved for tax; no discretionary ──
      c401k  = Math.min(postTax * (s.rate401k / 100), capRem);
      remInc = postTax - c401k - rent - exp;
      pSav   = s.inheritanceMonthly;
    } else {
      // ── Phase 2: discretionary first, then 401K, then expenses, then savings ──
      disc        = (s.annualDiscretionary || 0) / 9;  // spread over 9 Phase-2 months
      var base    = Math.max(0, postTax - rent - disc);
      c401k       = Math.min(base, capRem);
      remInc      = Math.max(0, base - c401k - exp);
      pSav        = remInc + s.inheritanceMonthly;
    }

    cum401k += c401k;

    months.push({
      month: i, gross: gross, postTax: postTax, c401k: c401k,
      cum401k: cum401k, rent: rent, disc: disc, exp: exp, remInc: remInc,
      taxPay: i === 4 ? s.expectedTaxPayment : 0,
      pSav: pSav, phase: i <= 3 ? 1 : 2
    });
  }

  var q1Accrual = months[0].remInc + months[1].remInc + months[2].remInc;
  var taxGap    = q1Accrual - s.expectedTaxPayment;
  var tot401k   = months.reduce(function(a, m) { return a + m.c401k; }, 0);
  var totPSav   = months.reduce(function(a, m) { return a + m.pSav; }, 0);
  var totDisc   = months.reduce(function(a, m) { return a + m.disc; }, 0);
  var bonus     = s.annualSalary * (s.bonusPct / 100);
  var bonusSav  = bonus * (s.pctBonusSaved / 100);
  var bonusLeft = bonus - bonusSav;
  var totSav    = tot401k + totPSav + bonusSav + s.employer401kMatch;

  return { months: months, q1Accrual: q1Accrual, taxGap: taxGap,
    tot401k: tot401k, totPSav: totPSav, totDisc: totDisc, bonus: bonus,
    bonusSav: bonusSav, bonusLeft: bonusLeft, totSav: totSav };
}

// ── CoastFIRE solver ───────────────────────────────────────────────────────────
// Both lines grow at the real return rate (r − inflation).
//
// CoastFIRE target line: target(year) = target0 × (1+realRet)^year
//   where target0 = FI / (1+realRet)^(retirementYears) — the PV of FI today.
//   At retirement it equals the FI number exactly.
//
// Portfolio line: portfolio(year) = portfolio(year-1) × (1+realRet)  +  annualSavFV
//   where annualSavFV = FV at year-end of 12 equal monthly deposits:
//   = (annualSavings/12) × Σ(k=0..11) (1+realRet)^(k/12)
//   (month 1 deposit compounds 11/12 year, month 12 compounds 0/12)
//
// CoastFIRE = the year the portfolio line first crosses (≥) the target line.
// After that age, existing assets alone will compound to FI by retirement.
function computeCoastFIRE(s, annualSavings) {
  var realRet    = s.returnRate/100 - s.inflationRate/100;
  var FI         = s.targetSpending / (s.swr / 100);
  var yrsToRetire = s.retirementAge - s.currentAge;
  var target0    = FI / Math.pow(1 + realRet, yrsToRetire);

  // FV of monthly deposits within one year (deposits at start of each month)
  var monthlySav = annualSavings / 12;
  var annSavFV   = 0;
  for (var k = 0; k < 12; k++) annSavFV += monthlySav * Math.pow(1 + realRet, k / 12);

  console.log('[CoastFIRE] realRet=%.4f  FI=%.0f  target0=%.0f  annualSav=%.0f  annSavFV=%.0f',
    realRet, FI, target0, annualSavings, annSavFV);

  var port   = totalAssets(s);
  var tgt    = target0;
  var maxYrs = Math.ceil(yrsToRetire) + 1;

  // Already coasting?
  if (port >= tgt) {
    return { coastAge: s.currentAge, coastAgeRounded: s.currentAge,
      yearsToCoast: 0, target: target0, FI: FI, achieved: true };
  }

  for (var yr = 1; yr <= maxYrs; yr++) {
    var prevPort = port, prevTgt = tgt;
    port = port * (1 + realRet) + annSavFV;
    tgt  = tgt  * (1 + realRet);
    console.log('[CoastFIRE] year %2d  age %.1f  port=%.0f  tgt=%.0f  gap=%.0f',
      yr, s.currentAge + yr, port, tgt, port - tgt);

    if (port >= tgt) {
      // Linear interpolation for sub-year precision
      var prevGap = prevPort - prevTgt;    // negative
      var newGap  = port - tgt;            // positive
      var frac    = -prevGap / (newGap - prevGap);
      var rawAge  = s.currentAge + (yr - 1) + frac;
      var rndAge  = Math.round(rawAge * 2) / 2;
      console.log('[CoastFIRE] → crossing at year %.3f  age %.3f  rounded %.1f', yr-1+frac, rawAge, rndAge);
      return { coastAge: rawAge, coastAgeRounded: rndAge,
        yearsToCoast: rawAge - s.currentAge, target: target0, FI: FI, achieved: false };
    }
  }

  return { coastAge: s.retirementAge, coastAgeRounded: s.retirementAge,
    yearsToCoast: yrsToRetire, target: target0, FI: FI, achieved: false, unreachable: true };
}

// ── 401K Phase-1 optimizer ─────────────────────────────────────────────────────
// Finds the Phase-1 rate such that Q1 remaining income = expected tax payment.
// Higher rate → more 401K deducted → less remaining income → smaller accrual.
function optimize401k(s) {
  function q1(rate) {
    return computeBudget(Object.assign({}, s, { rate401k: rate })).q1Accrual;
  }
  if (q1(0) <= s.expectedTaxPayment) return 0;   // even at 0% we don't over-accrue
  var lo = 0, hi = 100;
  for (var i = 0; i < 120; i++) {
    var mid = (lo + hi) / 2;
    if (q1(mid) > s.expectedTaxPayment) lo = mid; else hi = mid;
    if (hi - lo < 0.001) break;
  }
  return Math.round((lo + hi) / 2 * 100) / 100;
}

// ── Chart tooltip + sliding dots (hover) ───────────────────────────────────────
// hx, hy1, hy2  = SVG-space coords for the two sliding dots
// d1Blue        = 1 → dot1 is on the blue CoastFIRE line; 0 → switched to gray contrib line
function cfTip(e, age, nw, coast, fi, hx, hy1, hy2, d1Blue) {
  // ── tooltip card ──
  var tip = document.getElementById('cf-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'cf-tip';
    tip.style.cssText = 'position:fixed;background:#fff;border:1px solid #E4DDD2;border-radius:10px;'+
      'padding:11px 15px;font-size:12px;line-height:2;box-shadow:0 4px 18px rgba(0,0,0,.13);'+
      'pointer-events:none;z-index:9999;min-width:200px;color:#2D2D2D';
    document.body.appendChild(tip);
  }
  tip.innerHTML =
    '<div style="font-weight:700;font-size:12.5px;margin-bottom:2px;color:#2D2D2D">Age: '+age+'</div>'+
    '<div>Net Worth: <strong>'+fmt(nw)+'</strong></div>'+
    '<div>CoastFIRE number: <strong style="color:#5B7FA6">'+fmt(coast)+'</strong></div>'+
    '<div>FIRE number: <strong style="color:#C06060">'+fmt(fi)+'</strong></div>';
  var tx = e.clientX + 18, ty = e.clientY - 14;
  if (tx + 220 > window.innerWidth - 12) tx = e.clientX - 232;
  tip.style.left = tx + 'px';
  tip.style.top  = ty + 'px';
  tip.style.display = 'block';

  // ── sliding dots + crosshair ──
  if (hx === undefined) return;
  var dot1  = document.getElementById('cf-dot-1');
  var dot2  = document.getElementById('cf-dot-2');
  var xhair = document.getElementById('cf-xhair');
  if (xhair) { xhair.setAttribute('x1', hx); xhair.setAttribute('x2', hx); xhair.setAttribute('display','inline'); }
  if (dot1)  {
    dot1.setAttribute('cx', hx); dot1.setAttribute('cy', hy1);
    dot1.setAttribute('fill', d1Blue ? '#5B7FA6' : '#A0978C');
    dot1.setAttribute('display','inline');
  }
  if (dot2)  { dot2.setAttribute('cx', hx); dot2.setAttribute('cy', hy2); dot2.setAttribute('display','inline'); }
}
function cfTipHide() {
  var tip = document.getElementById('cf-tip');
  if (tip) tip.style.display = 'none';
  ['cf-dot-1','cf-dot-2','cf-xhair'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.setAttribute('display','none');
  });
}

// ── SVG chart ──────────────────────────────────────────────────────────────────
// 4-series chart:
//   gray dashed  = portfolio growing with contributions all the way to retirement
//   blue line    = CoastFIRE target (target0 growing at realRet → FI at retirement)
//   green + fill = net worth coasting (contributions stop at CoastFIRE age, then compound only)
//   red dashed   = FIRE number (horizontal)
function buildChart(s, budget) {
  var realRet  = s.returnRate/100 - s.inflationRate/100;
  var FI       = s.targetSpending / (s.swr / 100);
  var ann      = budget.totSav;
  var span     = s.retirementAge - s.currentAge;
  var cf       = computeCoastFIRE(s, ann);
  var target0  = cf.target;   // CoastFIRE number in today's dollars

  // FV of 12 monthly contributions within a year (same formula as solver)
  var monthlySav = ann / 12;
  var annSavFV   = 0;
  for (var k = 0; k < 12; k++) annSavFV += monthlySav * Math.pow(1 + realRet, k / 12);

  // Build year-by-year series
  var contribPts = [[s.currentAge, totalAssets(s)]];   // gray dashed
  var targetPts  = [[s.currentAge, target0]];            // blue
  var coastPts   = [[s.currentAge, totalAssets(s)]];   // green + fill

  var portC       = totalAssets(s);
  var portK       = totalAssets(s);
  var tgt         = target0;
  var coastDone   = cf.achieved;
  var numYears    = Math.ceil(span) + 2;

  for (var yr = 1; yr <= numYears; yr++) {
    var age = s.currentAge + yr;
    if (age > s.retirementAge + 0.1) break;

    portC = portC * (1 + realRet) + annSavFV;
    tgt   = tgt   * (1 + realRet);

    // portCoast: same as portContrib until the year after CoastFIRE age, then just compound
    if (!coastDone && (s.currentAge + yr - 1) < cf.coastAge) {
      portK = portK * (1 + realRet) + annSavFV;
      // check if we've now passed the coast age after this year's growth
      if (age >= cf.coastAge) coastDone = true;
    } else {
      coastDone = true;
      portK = portK * (1 + realRet);
    }

    contribPts.push([age, portC]);
    targetPts.push([age, tgt]);
    coastPts.push([age, portK]);
  }

  // Scale: top of chart = FI × 1.12, but at least max of portContrib
  var maxC = 0;
  for (var i = 0; i < contribPts.length; i++) if (contribPts[i][1] > maxC) maxC = contribPts[i][1];
  var maxV = Math.max(FI * 1.12, maxC * 1.05);

  var W=700, H=280, pL=76, pR=28, pT=24, pB=40;
  var cW = W-pL-pR, cH = H-pT-pB;

  function xs(age) { return pL + (age - s.currentAge) / span * cW; }
  function ys(v)   { return H - pB - Math.min(1, Math.max(0, v / maxV)) * cH; }
  function mkPath(pts) {
    return pts.map(function(p, idx) {
      return (idx===0?'M':'L') + xs(p[0]).toFixed(1) + ',' + ys(p[1]).toFixed(1);
    }).join(' ');
  }

  var tc = '#7A7168', gc = '#E8E2D8';

  // Y-axis ticks (6 levels)
  var yticks = [];
  for (var k = 0; k <= 5; k++) yticks.push(maxV * k / 5);

  // X-axis ticks every 5 years
  var xticks = [];
  var xStart = Math.ceil((s.currentAge + 0.01) / 5) * 5;
  for (var a = xStart; a <= s.retirementAge; a += 5) xticks.push(a);

  var svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';

  // grid lines
  svg += yticks.map(function(v) {
    var y = ys(v).toFixed(1);
    return '<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="'+gc+'" stroke-width="1"/>';
  }).join('');

  // Red dashed FIRE number
  var fiY = ys(FI).toFixed(1);
  svg += '<line x1="'+pL+'" y1="'+fiY+'" x2="'+(W-pR)+'" y2="'+fiY+
         '" stroke="#C06060" stroke-width="1.5" stroke-dasharray="6,4" opacity=".9"/>';

  // Green fill under coast portfolio
  var lastCoast = coastPts[coastPts.length-1];
  var fillD = mkPath(coastPts) +
    ' L'+xs(lastCoast[0]).toFixed(1)+','+(H-pB)+
    ' L'+pL+','+(H-pB)+' Z';
  svg += '<path d="'+fillD+'" fill="rgba(94,158,110,.13)"/>';

  // Gray dashed: portfolio with continued contributions
  svg += '<path d="'+mkPath(contribPts)+'" stroke="#A0978C" fill="none" stroke-width="2"'+
         ' stroke-dasharray="7,4" stroke-linejoin="round"/>';

  // Blue: CoastFIRE target line
  svg += '<path d="'+mkPath(targetPts)+'" stroke="#5B7FA6" fill="none" stroke-width="2.5"'+
         ' stroke-linejoin="round"/>';

  // Green: coast portfolio
  svg += '<path d="'+mkPath(coastPts)+'" stroke="#5E9E6E" fill="none" stroke-width="2.5"'+
         ' stroke-linejoin="round"/>';

  // ── Reusable hidden elements: crosshair + two sliding dots ──
  // These are shown/moved by cfTip() on hover; hidden by cfTipHide() on mouse-leave.
  svg += '<line id="cf-xhair" x1="0" y1="'+pT+'" x2="0" y2="'+(H-pB)+
         '" stroke="#C8C2B8" stroke-width="1" stroke-dasharray="3,2" display="none"/>';
  svg += '<circle id="cf-dot-1" cx="0" cy="0" r="6" fill="#5B7FA6" stroke="#fff" stroke-width="2.5" display="none"/>';
  svg += '<circle id="cf-dot-2" cx="0" cy="0" r="6" fill="#5E9E6E" stroke="#fff" stroke-width="2.5" display="none"/>';

  // Y axis labels
  svg += yticks.map(function(v) {
    return '<text x="'+(pL-7)+'" y="'+(ys(v)+4)+'" text-anchor="end" font-size="10" fill="'+tc+'">'+fmtM(v)+'</text>';
  }).join('');

  // X axis labels — skip 5-yr ticks that are within 3 years of either endpoint to avoid overlap
  svg += '<text x="'+(pL+3)+'" y="'+(H-pB+15)+'" text-anchor="start" font-size="10" fill="'+tc+'">'+s.currentAge+'</text>';
  svg += xticks.filter(function(a) {
    return (a - s.currentAge) >= 3 && (s.retirementAge - a) >= 3;
  }).map(function(a) {
    return '<text x="'+xs(a).toFixed(1)+'" y="'+(H-pB+15)+'" text-anchor="middle" font-size="10" fill="'+tc+'">'+a+'</text>';
  }).join('');
  svg += '<text x="'+(W-pR-3)+'" y="'+(H-pB+15)+'" text-anchor="end" font-size="10" fill="'+tc+'">'+s.retirementAge+'</text>';

  // ── legend (top-left) ──
  var lx = pL + 6, ly = pT + 4;
  var lw = 218, lh = 76;
  svg += '<rect x="'+lx+'" y="'+ly+'" width="'+lw+'" height="'+lh+
         '" rx="5" fill="rgba(255,255,255,.93)" stroke="'+gc+'" stroke-width="1"/>';

  // row 1: gray dashed
  svg += '<line x1="'+(lx+8)+'" y1="'+(ly+14)+'" x2="'+(lx+26)+'" y2="'+(ly+14)+
         '" stroke="#A0978C" stroke-width="2" stroke-dasharray="5,3"/>';
  svg += '<text x="'+(lx+31)+'" y="'+(ly+18)+'" font-size="10.5" fill="'+tc+'">With contributions</text>';

  // row 2: blue
  svg += '<line x1="'+(lx+8)+'" y1="'+(ly+30)+'" x2="'+(lx+26)+'" y2="'+(ly+30)+
         '" stroke="#5B7FA6" stroke-width="2.5"/>';
  svg += '<text x="'+(lx+31)+'" y="'+(ly+34)+'" font-size="10.5" fill="'+tc+'">CoastFIRE number</text>';

  // row 3: green
  svg += '<line x1="'+(lx+8)+'" y1="'+(ly+46)+'" x2="'+(lx+26)+'" y2="'+(ly+46)+
         '" stroke="#5E9E6E" stroke-width="2.5"/>';
  svg += '<text x="'+(lx+31)+'" y="'+(ly+50)+'" font-size="10.5" fill="'+tc+'">Net worth (coasting)</text>';

  // row 4: red dashed
  svg += '<line x1="'+(lx+8)+'" y1="'+(ly+62)+'" x2="'+(lx+26)+'" y2="'+(ly+62)+
         '" stroke="#C06060" stroke-width="1.5" stroke-dasharray="5,3"/>';
  svg += '<text x="'+(lx+31)+'" y="'+(ly+66)+'" font-size="10.5" fill="'+tc+'">FIRE number ('+fmtM(FI)+')</text>';

  // ── Invisible vertical hit strips — hover drives tooltip + sliding dots ──
  // Rendered last so they sit on top of all chart elements.
  for (var hi = 0; hi < contribPts.length; hi++) {
    var hAge   = contribPts[hi][0];
    var hNw    = Math.round(coastPts[hi][1]);
    var hCoast = Math.round(targetPts[hi][1]);

    // Dot 1: follows CoastFIRE target (blue) until crossing, then contrib line (gray)
    var hD1Blue = (hAge <= cf.coastAge) ? 1 : 0;
    var hY1     = hD1Blue ? ys(targetPts[hi][1]) : ys(contribPts[hi][1]);
    // Dot 2: always on the coasting net-worth line (green)
    var hY2     = ys(coastPts[hi][1]);
    var hX      = xs(hAge);

    // strip spans from midpoint-to-prev to midpoint-to-next
    var x1h = hi === 0
      ? pL
      : xs((contribPts[hi-1][0] + hAge) / 2);
    var x2h = hi === contribPts.length - 1
      ? (W - pR)
      : xs((hAge + contribPts[hi+1][0]) / 2);
    var stripW = Math.max(1, x2h - x1h);

    svg += '<rect x="'+x1h.toFixed(1)+'" y="'+pT+'" width="'+stripW.toFixed(1)+'" height="'+(H-pT-pB)+'"'+
      ' fill="transparent" style="cursor:crosshair"'+
      ' onmouseover="cfTip(event,'+hAge+','+hNw+','+hCoast+','+Math.round(FI)+','+
        hX.toFixed(2)+','+hY1.toFixed(2)+','+hY2.toFixed(2)+','+hD1Blue+')"'+
      ' onmouseout="cfTipHide()"/>';
  }

  svg += '</svg>';
  return svg;
}

// ── render CoastFIRE tab ───────────────────────────────────────────────────────
function renderCoastFire(s, budget) {
  var cf       = computeCoastFIRE(s, budget.totSav);
  var span     = s.retirementAge - s.currentAge;
  var coastPct = span > 0 ? Math.min(97, Math.max(3, (cf.yearsToCoast / span) * 100)) : 0;
  // Display age: rounded to nearest 0.5
  var dispAge  = cf.coastAgeRounded;
  var dispYrs  = cf.yearsToCoast.toFixed(1);
  var html     = '';

  // ── KPI cards ──
  var brokerageYears = s.targetSpending > 0 ? (s.brokerageAssets / s.targetSpending).toFixed(1) : '—';
  var bufferNeeded   = s.targetSpending * 3;
  var bufferOk       = s.brokerageAssets >= bufferNeeded;
  html += '<div class="stat-grid">';
  html += '<div class="stat"><div class="stat-label">CoastFIRE Savings Target</div>'+
    '<div class="stat-value" style="color:var(--amber)">'+fmt(cf.target)+'</div>'+
    '<div class="stat-sub">total portfolio needed (today\'s $)</div></div>';
  html += '<div class="stat"><div class="stat-label">Years to CoastFIRE</div>'+
    '<div class="stat-value" style="color:var(--accent)">'+(cf.achieved ? '0' : dispYrs)+'</div>'+
    '<div class="stat-sub">at current savings rate</div></div>';
  html += '<div class="stat"><div class="stat-label">CoastFIRE Age</div>'+
    '<div class="stat-value" style="color:var(--green)">'+(cf.achieved ? s.currentAge : dispAge)+'</div>'+
    '<div class="stat-sub">stop contributing, let it grow</div></div>';
  html += '<div class="stat"><div class="stat-label">Brokerage Account</div>'+
    '<div class="stat-value" style="color:var(--accent)">'+fmt(s.brokerageAssets)+'</div>'+
    '<div class="stat-sub">accessible now · '+brokerageYears+' yrs of spending</div></div>';
  html += '<div class="stat"><div class="stat-label">IRA / 401K</div>'+
    '<div class="stat-value" style="color:var(--accent)">'+fmt(s.iraAssets)+'</div>'+
    '<div class="stat-sub">locked until age 59.5</div></div>';
  html += '<div class="stat"><div class="stat-label">3-Year Buffer Needed</div>'+
    '<div class="stat-value" style="color:'+(bufferOk?'var(--green)':'var(--amber)')+'">'+fmt(bufferNeeded)+'</div>'+
    '<div class="stat-sub">'+(bufferOk ? '✓ brokerage covers buffer' : 'need '+fmt(bufferNeeded - s.brokerageAssets)+' more in brokerage')+'</div></div>';
  html += '</div>';

  // ── timeline card ──
  html += '<div class="card"><div class="card-title">Age Timeline</div>';
  html += '<div class="prog-label" style="margin-bottom:8px">'+
    '<span>Current age <strong>'+s.currentAge+'</strong></span>'+
    '<span>'+(cf.achieved
      ? '<span style="color:var(--green);font-weight:700">Already at CoastFIRE!</span>'
      : 'Coast at age <strong style="color:var(--green)">'+dispAge+'</strong>')+
    '</span>'+
    '<span>Retire at <strong>'+s.retirementAge+'</strong></span>'+
    '</div>';
  html += '<div class="timeline"><div class="tl-track">'+
    '<div class="tl-fill-done" style="width:'+coastPct+'%"></div>'+
    '<div class="tl-fill-coast" style="left:'+coastPct+'%;width:'+(100-coastPct)+'%"></div>'+
    '</div>';
  html += '<div class="tl-dot" style="left:0.5%;background:var(--accent)">'+
    '<div class="tl-label" style="transform:none;left:0">'+s.currentAge+'</div></div>';
  if (!cf.achieved && !cf.unreachable) {
    html += '<div class="tl-dot" style="left:'+coastPct+'%;background:var(--green)">'+
      '<div class="tl-label">'+dispAge+'</div></div>';
  }
  html += '<div class="tl-dot" style="left:98.5%;background:var(--muted)">'+
    '<div class="tl-label" style="right:0;transform:none;left:auto">'+s.retirementAge+'</div></div>';
  html += '</div>';

  if (cf.unreachable) {
    html += '<div style="margin-top:14px;padding:10px 12px;background:#FEF3F2;border:1px solid #FCA5A5;'+
      'border-radius:8px;font-size:12px;color:#991B1B">'+
      '⚠ CoastFIRE not reachable before retirement with current inputs. Increase savings rate or return rate.</div>';
  }
  html += '</div>'; // close timeline card

  // ── IRA / Brokerage withdrawal strategy card ──
  var realRet2    = s.returnRate/100 - s.inflationRate/100;
  var annBrok     = budget.totPSav + budget.bonusSav;  // personal + bonus savings → brokerage
  var annIRA      = budget.tot401k + s.employer401kMatch;
  // Project brokerage and IRA at CoastFIRE age (contributions stop then)
  var yrsToCoast  = cf.achieved ? 0 : cf.yearsToCoast;
  var mSavFV      = annBrok / 12;
  var brokSavFV   = 0;
  for (var bk = 0; bk < 12; bk++) brokSavFV += mSavFV * Math.pow(1 + realRet2, bk / 12);
  var mIRAFV      = annIRA / 12;
  var iraSavFV    = 0;
  for (var ik = 0; ik < 12; ik++) iraSavFV += mIRAFV * Math.pow(1 + realRet2, ik / 12);
  var projBrok    = s.brokerageAssets, projIRA = s.iraAssets;
  for (var py = 0; py < Math.floor(yrsToCoast); py++) {
    projBrok = projBrok * (1 + realRet2) + brokSavFV;
    projIRA  = projIRA  * (1 + realRet2) + iraSavFV;
  }
  var bufferAtCoast  = s.targetSpending * 3;
  var bufferCoastOk  = projBrok >= bufferAtCoast;
  var ageAt59h       = 59.5;
  var yrsEarlyRetire = Math.max(0, ageAt59h - (cf.achieved ? s.currentAge : cf.coastAge));
  var iraUnlockAge   = 59.5;

  html += '<div class="card"><div class="card-title">Withdrawal Strategy: Brokerage Buffer</div>';
  html += '<div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.7">'+
    'Before age 59.5 you draw from the <strong>brokerage account</strong> as a buffer. '+
    'Keep <strong>3 years × spending</strong> in cash/brokerage at all times. '+
    'At year-end: if the market is up, sell to replenish what you spent; '+
    'if the market is down, wait — your 2 remaining buffer years absorb the downturn. '+
    'At 59.5, switch to the IRA while the remaining brokerage compounds back up.</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:12px;margin-bottom:10px">';
  html += '<div style="padding:10px;background:var(--card2);border:1px solid var(--border2);border-radius:8px">'+
    '<div style="color:var(--muted);margin-bottom:3px">IRA unlocks at</div>'+
    '<strong style="font-size:15px">Age '+iraUnlockAge+'</strong></div>';
  html += '<div style="padding:10px;background:var(--card2);border:1px solid var(--border2);border-radius:8px">'+
    '<div style="color:var(--muted);margin-bottom:3px">Early-retire window</div>'+
    '<strong style="font-size:15px">'+yrsEarlyRetire.toFixed(1)+' yrs</strong>'+
    '<div style="font-size:10.5px;color:var(--muted);margin-top:2px">coast age → 59.5</div></div>';
  html += '<div style="padding:10px;background:var(--card2);border:1px solid var(--border2);border-radius:8px">'+
    '<div style="color:var(--muted);margin-bottom:3px">Projected brokerage at coast</div>'+
    '<strong style="font-size:15px;color:'+(bufferCoastOk?'var(--green)':'var(--amber)')+'">'+fmt(projBrok)+'</strong>'+
    '<div style="font-size:10.5px;color:var(--muted);margin-top:2px">need '+fmt(bufferAtCoast)+' for 3-yr buffer</div></div>';
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;font-size:12px">';
  html += '<div style="padding:10px;background:var(--card2);border:1px solid var(--border2);border-radius:8px">'+
    '<div style="color:var(--muted);margin-bottom:3px">Annual → Brokerage (personal + bonus)</div>'+
    '<strong>'+fmt(annBrok)+'</strong></div>';
  html += '<div style="padding:10px;background:var(--card2);border:1px solid var(--border2);border-radius:8px">'+
    '<div style="color:var(--muted);margin-bottom:3px">Annual → IRA (401K + match)</div>'+
    '<strong>'+fmt(annIRA)+'</strong></div>';
  html += '</div></div>';

  // ── chart ──
  html += '<div class="card"><div class="card-title">Portfolio vs. CoastFIRE Target</div>'+
    '<div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">'+
    'Both your portfolio and the CoastFIRE target grow at the real return rate ('+pct((s.returnRate-s.inflationRate),2)+'). '+
    'Green dot = age '+cf.coastAgeRounded+': portfolio crosses the CoastFIRE number — contributions can stop.</div>'+
    '<div class="chart-wrap">'+buildChart(s, budget)+'</div></div>';

  // ── assumptions ──
  var r = s.returnRate/100, realRet = r - s.inflationRate/100;
  html += '<div class="card"><div class="card-title">Key Figures</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:12px">'+
    '<div><div style="color:var(--muted);margin-bottom:2px">Nominal return</div><strong>'+pct(s.returnRate)+'</strong></div>'+
    '<div><div style="color:var(--muted);margin-bottom:2px">Inflation</div><strong>'+pct(s.inflationRate)+'</strong></div>'+
    '<div><div style="color:var(--muted);margin-bottom:2px">Real return (r−π)</div><strong>'+pct(realRet*100,2)+'</strong></div>'+
    '<div><div style="color:var(--muted);margin-bottom:2px">FI number (spending / SWR)</div><strong>'+fmt(s.targetSpending/(s.swr/100))+'</strong></div>'+
    '<div><div style="color:var(--muted);margin-bottom:2px">Brokerage (liquid)</div><strong>'+fmt(s.brokerageAssets)+'</strong></div>'+
    '<div><div style="color:var(--muted);margin-bottom:2px">IRA / 401K (locked until 59.5)</div><strong>'+fmt(s.iraAssets)+'</strong></div>'+
    '<div><div style="color:var(--muted);margin-bottom:2px">Total assets</div><strong>'+fmt(totalAssets(s))+'</strong></div>'+
    '<div><div style="color:var(--muted);margin-bottom:2px">Annual savings (budget)</div><strong>'+fmt(budget.totSav)+'</strong></div>'+
    '</div></div>';

  return html;
}

// ── render Budget tab ──────────────────────────────────────────────────────────
function renderBudget(s, budget) {
  var html = '';
  html += '<div class="card"><div class="card-title">'+s.planningYear+' Monthly Cash Flow</div>';

  // Phase legend
  html += '<div style="display:flex;gap:16px;margin-bottom:12px;font-size:11.5px;flex-wrap:wrap">'+
    '<span><span class="chip chip-blue">Phase 1</span> Jan–Mar: contribute at <strong>'+pct(s.rate401k,2)+'</strong> to accrue tax reserve</span>'+
    '<span><span class="chip chip-green">Phase 2</span> Apr–Dec: discretionary first → 401K → expenses → personal savings</span>'+
    '</div>';

  html += '<div class="tbl-wrap"><table>';
  html += '<tr><th>Month</th><th>Gross</th><th>Post-Tax</th>'+
    '<th>401K</th><th>Cum 401K</th><th>Rent</th>'+
    '<th>Discretionary<sup title="Spread over Apr–Dec only">‡</sup></th>'+
    '<th>Expenses</th>'+
    '<th>Remaining</th><th>Tax Accrual</th><th>Tax Paid</th><th>Tax Gap</th>'+
    '<th>Personal Sav<sup title="Includes inheritance">†</sup></th></tr>';

  var q1Cum = 0;
  var inPhase2 = false;
  budget.months.forEach(function(m, idx) {
    // Phase divider row between March and April
    if (idx === 3 && !inPhase2) {
      inPhase2 = true;
      html += '<tr class="phase-header"><td colspan="13"><span class="chip chip-green">Phase 2</span> '+
        ' Discretionary first → 401K maximised → expenses → personal savings</td></tr>';
    }

    if (idx < 3) q1Cum += m.remInc;

    // Tax accrual column
    var accrualCell;
    if (idx < 3) {
      accrualCell = '<td class="neu">'+fmt(q1Cum)+'</td>';
    } else if (idx === 3) {
      accrualCell = '<td class="neu" title="End-of-March pool">'+fmt(q1Cum)+'</td>';
    } else {
      accrualCell = '<td class="neu dim">—</td>';
    }

    // Tax gap (April only)
    var gapCell;
    if (idx === 3) {
      gapCell = '<td class="'+(budget.taxGap >= 0 ? 'pos' : 'neg')+'">'+fmt(budget.taxGap)+'</td>';
    } else {
      gapCell = '<td class="neu dim">—</td>';
    }

    // Tax paid column — April shows "(from pool)"
    var taxCell;
    if (idx === 3) {
      taxCell = '<td class="neg" title="Paid from Jan–Mar accrual">'+fmt(m.taxPay)+'<br><span style="font-size:10px;font-weight:400;color:var(--muted)">(from pool)</span></td>';
    } else {
      taxCell = '<td class="neu dim">—</td>';
    }

    var rowStyle = idx < 3 ? ' style="background:rgba(91,127,166,.03)"' : '';

    html += '<tr'+rowStyle+'>';
    html += '<td>'+MONTHS[m.month-1]+(m.phase===1?' <span class="chip chip-blue" style="font-size:9px">P1</span>':'')+'</td>';
    html += '<td>'+fmt(m.gross)+'</td>';
    html += '<td>'+fmt(m.postTax)+'</td>';
    html += '<td class="'+(m.c401k>0?'pos':'neu')+'">'+fmt(m.c401k)+'</td>';
    html += '<td class="'+(m.cum401k>=s.annual401kCap?'dim':'neu')+'">'+fmt(m.cum401k)+
      (m.cum401k>=s.annual401kCap?' <span style="font-size:10px">⚑</span>':'')+'</td>';
    html += '<td class="'+(m.rent>0?'neg':'neu')+'">'+fmt(m.rent)+'</td>';
    html += '<td class="'+(m.disc>0?'neg':'neu dim')+'">'+
      (m.disc>0 ? fmt(m.disc) : '—')+'</td>';
    html += '<td class="'+(m.exp>0?'neg':'neu')+'">'+fmt(m.exp)+'</td>';
    html += '<td class="'+(m.remInc>=0?'pos':'neg')+'">'+fmt(m.remInc)+'</td>';
    html += accrualCell;
    html += taxCell;
    html += gapCell;
    html += '<td class="'+(m.pSav>0?'pos':m.pSav<0?'neg':'neu')+'">'+fmt(m.pSav)+
      (m.phase===1 ? '<br><span style="font-size:9.5px;color:var(--muted);font-weight:400">salary accruing</span>' : '')+'</td>';
    html += '</tr>';
  });
  html += '</table></div>';
  html += '<div style="margin-top:8px;font-size:11px;color:var(--muted);padding:0 2px;line-height:1.8">'+
    '<sup>†</sup> Personal savings include a minimum of <strong>'+fmt(s.inheritanceMonthly)+'/mo</strong> ('+fmt(s.inheritanceMonthly*12)+'/yr) '+
    'from a family inheritance disbursement. During Jan–Mar the salary portion accrues toward the '+
    'estimated tax payment; the inheritance amount is saved regardless.<br>'+
    (s.annualDiscretionary > 0
      ? '<sup>‡</sup> Discretionary spend of <strong>'+fmt(s.annualDiscretionary)+'/yr</strong> is deducted first from post-tax income in Phase 2 (Apr–Dec), '+
        'before 401K contributions and expenses. Monthly amount: '+fmt((s.annualDiscretionary/9))+'.'
      : '<sup>‡</sup> Set <em>Annual Discretionary ($)</em> in the sidebar to add vacation, one-off purchases, etc. — deducted before 401K in Apr–Dec.')+
    '</div>';
  html += '</div>';

  // ── annual summary ──
  html += '<div class="card"><div class="card-title">'+s.planningYear+' Annual Summary</div>';
  html += '<div class="sum-grid">';
  html += '<div class="sum-item"><div class="sum-item-label">Year-End Bonus</div>'+

  html += '<div class="sum-item"><div class="sum-item-label">Savings from Bonus ('+pct(s.pctBonusSaved)+')</div>'+
    '<div class="sum-item-value" style="color:var(--green)">'+fmt(budget.bonusSav)+'</div></div>';
  html += '<div class="sum-item"><div class="sum-item-label">Total 401K Contributions</div>'+
    '<div class="sum-item-value" style="color:var(--accent)">'+fmt(budget.tot401k)+
    (budget.tot401k>=s.annual401kCap?' <span style="font-size:12px;color:var(--green)">✓ maxed</span>':'')+'</div></div>';
  html += '<div class="sum-item"><div class="sum-item-label">Employer 401K Match</div>'+
    '<div class="sum-item-value" style="color:var(--accent)">'+fmt(s.employer401kMatch)+'</div></div>';
  if (budget.totDisc > 0) {
    html += '<div class="sum-item"><div class="sum-item-label">Discretionary Spend<sup>‡</sup></div>'+
      '<div class="sum-item-value" style="color:var(--amber)">'+fmt(budget.totDisc)+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+fmt(s.annualDiscretionary)+'/yr ÷ 9 mo (Apr–Dec)</div></div>';
  }
  html += '<div class="sum-item"><div class="sum-item-label">Personal Savings (incl. inheritance<sup>†</sup>)</div>'+
    '<div class="sum-item-value" style="color:var(--green)">'+fmt(budget.totPSav)+'</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+fmt(s.inheritanceMonthly*12)+'/yr inheritance included</div></div>';
  html += '<div class="sum-item highlight"><div class="sum-item-label">Total '+s.planningYear+' Savings</div>'+
    '<div class="sum-item-value" style="color:var(--green)">'+fmt(budget.totSav)+'</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:3px">401K + personal + bonus + match</div></div>';
  html += '</div>';

  // ── wedding progress ──
  var wPct = Math.min(100, budget.bonusLeft / s.weddingGoal * 100);
  var wRem = s.weddingGoal - budget.bonusLeft;
  html += '<div style="margin-top:14px;padding:14px 16px;background:var(--card2);border:1px solid var(--border2);border-radius:10px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'+
    '<span style="font-weight:600;font-size:13px">Wedding Savings</span>'+
    '<span style="color:var(--muted);font-size:11.5px">Goal: '+fmt(s.weddingGoal)+'</span></div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">'+
    '<span>Bonus remainder: <strong style="color:var(--amber)">'+fmt(budget.bonusLeft)+'</strong></span>';
  if (wRem <= 0) {
    html += '<span style="color:var(--green);font-weight:700">✓ Goal achieved! +'+fmt(-wRem)+' surplus</span>';
  } else {
    html += '<span style="color:var(--red)">'+fmt(wRem)+' still needed</span>';
  }
  html += '</div>';
  html += '<div class="wedding-bar"><div class="wedding-fill" style="width:'+wPct.toFixed(1)+'%"></div></div>';
  html += '<div style="font-size:11px;color:var(--muted);margin-top:5px">'+pct(wPct,1)+' of goal covered by bonus remainder</div>';
  html += '</div></div>';

  return html;
}

// ── Accounts tab: year-by-year brokerage vs IRA simulation ────────────────────
function computeAccounts(s, budget) {
  var realRet = s.returnRate/100 - s.inflationRate/100;
  var cf      = computeCoastFIRE(s, budget.totSav);

  // contributions split: personal+bonus → brokerage; 401K+match → IRA
  var annBrok = budget.totPSav + budget.bonusSav;
  var annIRA  = budget.tot401k + s.employer401kMatch;

  function annFV(annual) {
    var m = annual / 12, fv = 0;
    for (var k = 0; k < 12; k++) fv += m * Math.pow(1 + realRet, k / 12);
    return fv;
  }
  var brokFV = annFV(annBrok);
  var iraFV  = annFV(annIRA);

  var brok = s.brokerageAssets, ira = s.iraAssets;
  var pts  = [[s.currentAge, brok, ira]];
  var span = s.retirementAge - s.currentAge;

  for (var yr = 1; yr <= Math.ceil(span) + 2; yr++) {
    var age = s.currentAge + yr;
    if (age > s.retirementAge + 0.1) break;
    var contrib = (s.currentAge + yr - 1) < cf.coastAge;
    brok = brok * (1 + realRet) + (contrib ? brokFV : 0);
    ira  = ira  * (1 + realRet) + (contrib ? iraFV  : 0);
    pts.push([age, brok, ira]);
  }

  function atAge(targetAge) {
    for (var i = 0; i < pts.length - 1; i++) {
      if (pts[i][0] <= targetAge && pts[i+1][0] > targetAge) {
        var f = (targetAge - pts[i][0]);
        return [pts[i][1] + f*(pts[i+1][1]-pts[i][1]), pts[i][2] + f*(pts[i+1][2]-pts[i][2])];
      }
    }
    var last = pts[pts.length-1];
    return [last[1], last[2]];
  }

  return { pts: pts, cf: cf, annBrok: annBrok, annIRA: annIRA, atAge: atAge };
}

function buildAccountsChart(s, acc) {
  var realRet = s.returnRate/100 - s.inflationRate/100;
  var pts = acc.pts, cf = acc.cf;
  var FI  = s.targetSpending / (s.swr / 100);
  var span = s.retirementAge - s.currentAge;

  var maxV = 0;
  for (var i = 0; i < pts.length; i++) {
    var tot = pts[i][1] + pts[i][2];
    if (tot > maxV) maxV = tot;
  }
  maxV = Math.max(maxV * 1.1, FI * 1.05);

  var W=700, H=280, pL=80, pR=28, pT=24, pB=40;
  var cW = W-pL-pR, cH = H-pT-pB;

  function xs(age) { return pL + (age - s.currentAge) / span * cW; }
  function ys(v)   { return H - pB - Math.min(1, Math.max(0, v / maxV)) * cH; }
  function mkPath(arr, fi) {
    return arr.map(function(p, idx) {
      return (idx===0?'M':'L') + xs(p[0]).toFixed(1) + ',' + ys(p[fi]).toFixed(1);
    }).join(' ');
  }

  var tc = '#7A7168', gc = '#E8E2D8';
  var yticks = [];
  for (var k = 0; k <= 5; k++) yticks.push(maxV * k / 5);
  var xticks = [];
  var xStart = Math.ceil((s.currentAge + 0.01) / 5) * 5;
  for (var a = xStart; a <= s.retirementAge; a += 5) xticks.push(a);

  var svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';

  // grid
  svg += yticks.map(function(v) {
    var y = ys(v).toFixed(1);
    return '<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="'+gc+'" stroke-width="1"/>';
  }).join('');

  // vertical marker: CoastFIRE age
  if (!cf.achieved && !cf.unreachable && cf.coastAge <= s.retirementAge) {
    var cxA = xs(cf.coastAge).toFixed(1);
    svg += '<line x1="'+cxA+'" y1="'+pT+'" x2="'+cxA+'" y2="'+(H-pB)+
           '" stroke="#5E9E6E" stroke-width="1.5" stroke-dasharray="4,3" opacity=".7"/>';
    svg += '<text x="'+cxA+'" y="'+(pT-4)+'" text-anchor="middle" font-size="9.5" fill="#5E9E6E">CoastFIRE '+cf.coastAgeRounded+'</text>';
  }
  // vertical marker: age 59.5 (IRA unlock)
  if (s.currentAge < 59.5 && 59.5 < s.retirementAge) {
    var ira59x = xs(59.5).toFixed(1);
    svg += '<line x1="'+ira59x+'" y1="'+pT+'" x2="'+ira59x+'" y2="'+(H-pB)+
           '" stroke="#B8893A" stroke-width="1.5" stroke-dasharray="4,3" opacity=".7"/>';
    svg += '<text x="'+ira59x+'" y="'+(pT-4)+'" text-anchor="middle" font-size="9.5" fill="#B8893A">IRA unlocks 59.5</text>';
  }

  // IRA fill
  var lastIRA = pts[pts.length-1];
  var iraFillD = mkPath(pts, 2) + ' L'+xs(lastIRA[0]).toFixed(1)+','+(H-pB)+' L'+pL+','+(H-pB)+' Z';
  svg += '<path d="'+iraFillD+'" fill="rgba(184,137,58,.10)"/>';

  // Brokerage fill
  var brokFillD = mkPath(pts, 1) + ' L'+xs(lastIRA[0]).toFixed(1)+','+(H-pB)+' L'+pL+','+(H-pB)+' Z';
  svg += '<path d="'+brokFillD+'" fill="rgba(91,127,166,.10)"/>';

  // Combined total (gray dashed)
  var totalPath = pts.map(function(p, idx) {
    return (idx===0?'M':'L') + xs(p[0]).toFixed(1) + ',' + ys(p[1]+p[2]).toFixed(1);
  }).join(' ');
  svg += '<path d="'+totalPath+'" stroke="#A0978C" fill="none" stroke-width="1.8" stroke-dasharray="6,4"/>';

  // IRA line (amber)
  svg += '<path d="'+mkPath(pts, 2)+'" stroke="#B8893A" fill="none" stroke-width="2.5" stroke-linejoin="round"/>';

  // Brokerage line (blue)
  svg += '<path d="'+mkPath(pts, 1)+'" stroke="#5B7FA6" fill="none" stroke-width="2.5" stroke-linejoin="round"/>';

  // Hidden dots + crosshair for hover
  svg += '<line id="acc-xhair" x1="0" y1="'+pT+'" x2="0" y2="'+(H-pB)+'" stroke="#C8C2B8" stroke-width="1" stroke-dasharray="3,2" display="none"/>';
  svg += '<circle id="acc-dot-brok" cx="0" cy="0" r="5.5" fill="#5B7FA6" stroke="#fff" stroke-width="2" display="none"/>';
  svg += '<circle id="acc-dot-ira"  cx="0" cy="0" r="5.5" fill="#B8893A" stroke="#fff" stroke-width="2" display="none"/>';

  // Y axis labels
  svg += yticks.map(function(v) {
    return '<text x="'+(pL-7)+'" y="'+(ys(v)+4)+'" text-anchor="end" font-size="10" fill="'+tc+'">'+fmtM(v)+'</text>';
  }).join('');

  // X axis labels
  svg += '<text x="'+(pL+3)+'" y="'+(H-pB+15)+'" text-anchor="start" font-size="10" fill="'+tc+'">'+s.currentAge+'</text>';
  svg += xticks.filter(function(a) { return (a-s.currentAge)>=3 && (s.retirementAge-a)>=3; })
    .map(function(a) {
      return '<text x="'+xs(a).toFixed(1)+'" y="'+(H-pB+15)+'" text-anchor="middle" font-size="10" fill="'+tc+'">'+a+'</text>';
    }).join('');
  svg += '<text x="'+(W-pR-3)+'" y="'+(H-pB+15)+'" text-anchor="end" font-size="10" fill="'+tc+'">'+s.retirementAge+'</text>';

  // Legend
  var lx = pL + 6, ly = pT + 4, lw = 200, lh = 58;
  svg += '<rect x="'+lx+'" y="'+ly+'" width="'+lw+'" height="'+lh+'" rx="5" fill="rgba(255,255,255,.93)" stroke="'+gc+'"/>';
  svg += '<line x1="'+(lx+8)+'" y1="'+(ly+14)+'" x2="'+(lx+26)+'" y2="'+(ly+14)+'" stroke="#5B7FA6" stroke-width="2.5"/>';
  svg += '<text x="'+(lx+31)+'" y="'+(ly+18)+'" font-size="10.5" fill="'+tc+'">Brokerage</text>';
  svg += '<line x1="'+(lx+8)+'" y1="'+(ly+30)+'" x2="'+(lx+26)+'" y2="'+(ly+30)+'" stroke="#B8893A" stroke-width="2.5"/>';
  svg += '<text x="'+(lx+31)+'" y="'+(ly+34)+'" font-size="10.5" fill="'+tc+'">IRA / 401K</text>';
  svg += '<line x1="'+(lx+8)+'" y1="'+(ly+46)+'" x2="'+(lx+26)+'" y2="'+(ly+46)+'" stroke="#A0978C" stroke-width="1.8" stroke-dasharray="5,3"/>';
  svg += '<text x="'+(lx+31)+'" y="'+(ly+50)+'" font-size="10.5" fill="'+tc+'">Combined total</text>';

  // Hover strips
  for (var hi = 0; hi < pts.length; hi++) {
    var hAge = pts[hi][0];
    var hB   = Math.round(pts[hi][1]);
    var hI   = Math.round(pts[hi][2]);
    var hX   = xs(hAge);
    var hYb  = ys(pts[hi][1]);
    var hYi  = ys(pts[hi][2]);
    var x1h  = hi === 0 ? pL : xs((pts[hi-1][0] + hAge) / 2);
    var x2h  = hi === pts.length-1 ? W-pR : xs((hAge + pts[hi+1][0]) / 2);
    svg += '<rect x="'+x1h.toFixed(1)+'" y="'+pT+'" width="'+Math.max(1,x2h-x1h).toFixed(1)+'" height="'+(H-pT-pB)+'"'+
      ' fill="transparent" style="cursor:crosshair"'+
      ' onmouseover="accTip(event,'+hAge+','+hB+','+hI+','+hX.toFixed(2)+','+hYb.toFixed(2)+','+hYi.toFixed(2)+')"'+
      ' onmouseout="accTipHide()"/>';
  }

  svg += '</svg>';
  return svg;
}

function accTip(e, age, brok, ira, hx, hyB, hyI) {
  var tip = document.getElementById('acc-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'acc-tip';
    tip.style.cssText = 'position:fixed;background:#fff;border:1px solid #E4DDD2;border-radius:10px;'+
      'padding:11px 15px;font-size:12px;line-height:2;box-shadow:0 4px 18px rgba(0,0,0,.13);'+
      'pointer-events:none;z-index:9999;min-width:210px;color:#2D2D2D';
    document.body.appendChild(tip);
  }
  tip.innerHTML =
    '<div style="font-weight:700;font-size:12.5px;margin-bottom:2px">Age: '+age+'</div>'+
    '<div><span style="color:#5B7FA6;font-weight:600">Brokerage:</span> <strong>'+fmt(brok)+'</strong></div>'+
    '<div><span style="color:#B8893A;font-weight:600">IRA / 401K:</span> <strong>'+fmt(ira)+'</strong></div>'+
    '<div style="border-top:1px solid #E4DDD2;margin-top:4px;padding-top:4px">'+
    'Total: <strong>'+fmt(brok+ira)+'</strong></div>';
  var tx = e.clientX + 18;
  if (tx + 230 > window.innerWidth - 12) tx = e.clientX - 242;
  tip.style.left = tx + 'px';
  tip.style.top  = (e.clientY - 14) + 'px';
  tip.style.display = 'block';
  var xh = document.getElementById('acc-xhair');
  var db = document.getElementById('acc-dot-brok');
  var di = document.getElementById('acc-dot-ira');
  if (xh) { xh.setAttribute('x1',hx); xh.setAttribute('x2',hx); xh.setAttribute('display','inline'); }
  if (db) { db.setAttribute('cx',hx); db.setAttribute('cy',hyB); db.setAttribute('display','inline'); }
  if (di) { di.setAttribute('cx',hx); di.setAttribute('cy',hyI); di.setAttribute('display','inline'); }
}
function accTipHide() {
  var tip = document.getElementById('acc-tip');
  if (tip) tip.style.display = 'none';
  ['acc-xhair','acc-dot-brok','acc-dot-ira'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.setAttribute('display','none');
  });
}

function renderAccounts(s, budget) {
  var acc  = computeAccounts(s, budget);
  var cf   = acc.cf;
  var html = '';

  // projected values at milestone ages
  var at50   = acc.atAge(50);
  var at59h  = acc.atAge(59.5);
  var atRet  = acc.atAge(s.retirementAge);

  html += '<div class="stat-grid">';
  html += '<div class="stat"><div class="stat-label">Brokerage at Age 50</div>'+
    '<div class="stat-value" style="color:var(--accent)">'+fmtM(at50[0])+'</div>'+
    '<div class="stat-sub">personal + bonus savings compounding</div></div>';
  html += '<div class="stat"><div class="stat-label">IRA at Age 59.5</div>'+
    '<div class="stat-value" style="color:var(--amber)">'+fmtM(at59h[1])+'</div>'+
    '<div class="stat-sub">401K + employer match compounding</div></div>';
  html += '<div class="stat"><div class="stat-label">Total at Retirement ('+s.retirementAge+')</div>'+
    '<div class="stat-value" style="color:var(--green)">'+fmtM(atRet[0]+atRet[1])+'</div>'+
    '<div class="stat-sub">'+fmtM(atRet[0])+' brokerage + '+fmtM(atRet[1])+' IRA</div></div>';
  html += '</div>';

  // annual flow card
  html += '<div class="card"><div class="card-title">Annual Contribution Split</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px">';
  html += '<div style="padding:12px;background:rgba(91,127,166,.07);border:1px solid rgba(91,127,166,.2);border-radius:8px">'+
    '<div style="color:var(--accent);font-weight:600;margin-bottom:4px">→ Brokerage</div>'+
    '<div style="font-size:18px;font-weight:700">'+fmt(acc.annBrok)+'/yr</div>'+
    '<div style="color:var(--muted);margin-top:4px">Personal savings + bonus savings</div></div>';
  html += '<div style="padding:12px;background:rgba(184,137,58,.07);border:1px solid rgba(184,137,58,.2);border-radius:8px">'+
    '<div style="color:var(--amber);font-weight:600;margin-bottom:4px">→ IRA / 401K</div>'+
    '<div style="font-size:18px;font-weight:700">'+fmt(acc.annIRA)+'/yr</div>'+
    '<div style="color:var(--muted);margin-top:4px">401K contributions + employer match</div></div>';
  html += '</div>';
  html += '<div style="font-size:11.5px;color:var(--muted);margin-top:10px">'+
    'Contributions stop at CoastFIRE age <strong>'+cf.coastAgeRounded+'</strong>. '+
    'Both accounts continue compounding at the real return rate ('+pct(s.returnRate-s.inflationRate,2)+') until retirement.</div>';
  html += '</div>';

  // chart
  html += '<div class="card"><div class="card-title">Brokerage vs. IRA Over Time</div>'+
    '<div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">'+
    'Hover to see exact values at each age. Dashed vertical lines mark CoastFIRE and IRA unlock (59.5). '+
    'Gray dashed = combined total (matches CoastFIRE tab net worth line).</div>'+
    '<div class="chart-wrap">'+buildAccountsChart(s, acc)+'</div></div>';

  return html;
}

function tog(id) {
  S[id] = !S[id];
  var tg = document.getElementById('tg_'+id);
  var ts = document.getElementById('ts_'+id);
  if (tg) tg.className = 'toggle ' + (S[id] ? 'on' : '');
  if (ts) ts.textContent = S[id] ? 'Yes' : 'No';
  refreshMain();
}
function swTab(t) {
  S.tab = t;
  // update button states without full re-render
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    var tabName = b.getAttribute('onclick').match(/'([^']+)'/)[1];
    b.className = 'tab-btn' + (S.tab === tabName ? ' active' : '');
  });
  refreshMain();
}
function runOpt() {
  var rate = optimize401k(S);
  S.rate401k = rate;
  // update input field directly
  var el = document.getElementById('i_rate401k');
  if (el) el.value = rate;
  refreshMain();
}
function refreshMain() {
  var m = document.getElementById('main');
  if (!m) { render(); return; }
  var budget = computeBudget(S);
  m.innerHTML = S.tab==='coastfire' ? renderCoastFire(S, budget) : S.tab==='accounts' ? renderAccounts(S, budget) : renderBudget(S, budget);
  // keep header subtitle in sync
  var sub = document.querySelector('.hdr-sub');
  if (sub) sub.textContent = S.planningYear + ' Planning Year';
}

render();
</script>
</body>
</html>
